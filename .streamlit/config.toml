# Streamlit loads this from the repository root when the app is launched there.
# Separate sidebar palettes follow Streamlit's light/dark theme switch.
[theme.light.sidebar]
backgroundColor = "#EAF2F8"
secondaryBackgroundColor = "#DCEAF4"
textColor = "#17324D"
primaryColor = "#146C94"

[theme.dark.sidebar]
backgroundColor = "#152637"
secondaryBackgroundColor = "#20384E"
textColor = "#EAF3F9"
primaryColor = "#78C9E3"
