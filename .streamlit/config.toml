# Streamlit loads this from the repository root when the app is launched there.
# CSS in app/sidebar.css provides the theme-adaptive sidebar and navigation states.
[theme.light.sidebar]
backgroundColor = "#89CABB"
secondaryBackgroundColor = "#BFECDC"
textColor = "#123C33"
primaryColor = "#159B73"

[theme.dark.sidebar]
backgroundColor = "#15513F"
secondaryBackgroundColor = "#102A23"
textColor = "#E8F7F0"
primaryColor = "#4ED0A2"
